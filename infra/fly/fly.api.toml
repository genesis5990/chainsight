# Fly.io app definition for the ChainSight API (Fastify).
# App name: chainsight-api-dev
# Region: ord (Chicago — close to your timezone, low latency)

app = "chainsight-api-dev"
primary_region = "ord"

[build]
  # Paths in this file are relative to the config file's directory.
  # The deploy workflow passes --image-label and we run flyctl from the
  # repo root with --build-target-arg PROJECT_ROOT=. so the Dockerfile
  # COPY paths still work.
  dockerfile = "../../apps/api/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0  # scale-to-zero for cost
  processes = ["app"]

[http_service.concurrency]
  type = "connections"
  hard_limit = 250
  soft_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"
  CORS_ORIGINS = "https://chainsight-web-dev.fly.dev"

[[restart]]
  policy = "on-failure"
  retries = 3
