# Fly.io app definition for the ChainSight web frontend (Next.js).

app = "chainsight-web-dev"
primary_region = "ord"

[build]
  dockerfile = "../../apps/web/Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[http_service.concurrency]
  type = "connections"
  hard_limit = 250
  soft_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[env]
  NODE_ENV = "production"
  PORT = "3000"

[[restart]]
  policy = "on-failure"
  retries = 3
