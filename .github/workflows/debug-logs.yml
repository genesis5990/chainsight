name: Debug Fly Logs

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Fly app to fetch logs for'
        required: true
        default: 'chainsight-api-dev'

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Show app status
        run: flyctl status -a "${{ inputs.app }}"
      - name: List machines
        run: flyctl machine list -a "${{ inputs.app }}"
      - name: Fetch logs
        run: flyctl logs -a "${{ inputs.app }}" --no-tail || true
      - name: Try waking the app
        run: |
          MID=$(flyctl machine list -a "${{ inputs.app }}" --json | jq -r '.[] | select(.state != "destroyed") | .id' | head -1)
          if [ -n "$MID" ]; then
            echo "Starting machine $MID"
            flyctl machine start "$MID" -a "${{ inputs.app }}" || true
            sleep 5
            echo "--- logs after start ---"
            flyctl logs -a "${{ inputs.app }}" --no-tail || true
          fi
